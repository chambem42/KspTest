name: In-game tests

# A repository's KspTest in-game tests on GitHub's runners, as one job in its own workflow:
#
#   on:
#     push:
#     pull_request_target:
#       types: [opened, synchronize, reopened, labeled]
#     workflow_dispatch:
#   jobs:
#     ingame:
#       uses: chambem42/KspTest/.github/workflows/ingame.yml@main
#       permissions: { contents: read, pull-requests: write, statuses: write }
#       secrets: inherit
#       with:
#         test-project: KspTests/MyMod.KspTests.Run
#
# KSP comes from encrypted 7z volumes in a private repository's release (ci/Pack-KspGame.ps1), through the calling
# repository's environment ksp-game: its secrets KSP_GAME_KEY (the archive key) and KSP_GAME_TOKEN (fine-grained,
# Contents: read-only on the game repository alone) and its variable KSP_GAME_REPO (owner/name). Without the variable
# the in-game jobs are skipped with a notice, not failed (a fork running its own pushes, say).
#
# A fork's pull request (pull_request_target: the workflow is the default branch's, the code the PR's head) runs only
# when the gate action lets it: opened by someone with write access, or reviewed (its latest commit) and labelled
# run-ingame by such a one. Let in, its code runs on runners with the game and its key, as it would after a merge.
#
# The jobs: a gate, a check for the game, the tests (a job per leg, each split between `shards` jobs side by side,
# KSPTEST_SHARD), and per leg its results: summary, screenshots page and one commit status. The steps are KspTest's actions (.github/actions), which
# a repository can also use in a workflow of its own.

on:
  workflow_call:
    inputs:
      test-project:
        description: The KspTest .Run test project, from the repository root
        type: string
        required: true
      title:
        description: The results' title (summary, page) and their commit status's name, with the leg
        type: string
        default: In-game tests
      legs:
        description: The platforms, a JSON array of windows and linux
        type: string
        default: '["windows"]'
      shards:
        description: Jobs each leg's tests are split between
        type: number
        default: 1
      filter:
        description: dotnet test --filter (default all but the Explicit tests)
        type: string
        default: ""
      test-args:
        description: More dotnet test arguments, space separated
        type: string
        default: ""
      mods:
        description: CKAN identifiers installed into the game itself (what the test project builds against), space separated
        type: string
        default: ""
      prepare:
        description: >-
          A bash command run in the repository before the tests, with the game set up (KSPTEST_GAME, KSPTEST_ROOT): to
          stage references, say
        type: string
        default: ""
      artifact:
        description: An artifact of the calling run downloaded before the tests (a build job's output, say)
        type: string
        default: ""
      artifact-path:
        description: Where the artifact goes, from the repository root
        type: string
        default: ""
      coverage:
        description: >-
          The mod's assemblies to measure line coverage of (AltCover, on Windows), as the test project's build leaves
          them (one folder under a GameData), from the repository root, space separated: the report goes in the Windows
          leg's summary
        type: string
        default: ""
      timeout-minutes:
        description: Each test job's timeout
        type: number
        default: 90

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - id: gate
        uses: chambem42/KspTest/.github/actions/gate@main

  # whether the repository has the game set up (the environment ksp-game and its KSP_GAME_REPO), and each leg's jobs
  game:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: ksp-game
      deployment: false
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      shards: ${{ steps.check.outputs.shards }}
    steps:
      - id: check
        env:
          GAME_REPO: ${{ vars.KSP_GAME_REPO }}
          SHARDS: ${{ inputs.shards }}
        run: |
          if [ -n "$GAME_REPO" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::no game set up (the environment ksp-game's KSP_GAME_REPO): the in-game tests are skipped"; fi
          # each leg's jobs: its share of the tests, k/N ("" for all of them in one job)
          jq -nc --argjson n "$SHARDS" 'if $n > 1 then [range(1; $n + 1) | "\(.)/\($n)"] else [""] end' |
            sed 's/^/shards=/' >> "$GITHUB_OUTPUT"

  # One job per leg (the legs' shards, side by side as a matrix), so each leg's report waits for its own jobs only, not
  # the other leg's. The two run the same steps (the anchor).
  windows:
    needs: game
    if: needs.game.outputs.ready == 'true' && contains(fromJSON(inputs.legs), 'windows')
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.game.outputs.shards) }}
    name: in-game (windows${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    runs-on: windows-2022
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # the secrets (the caller's environment); not a deployment: the environment only holds them
    environment: &secrets
      name: ksp-game
      deployment: false
    defaults:
      run:
        shell: bash
    env:
      # this job's name in its artifacts: the leg, and its shard if split (1/3 -> windows-1)
      JOB_NAME: windows${{ matrix.shard && format('-{0}', matrix.shard) || '' }}
    steps: &test-steps
      - uses: actions/checkout@v6
        with:
          # a fork's pull request (pull_request_target): its head as the event saw it, which the gate let in
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' }}
          submodules: recursive
          persist-credentials: false
      - uses: chambem42/KspTest/.github/actions/setup@main
        with:
          game-repo: ${{ vars.KSP_GAME_REPO }}
          game-token: ${{ secrets.KSP_GAME_TOKEN }}
          game-key: ${{ secrets.KSP_GAME_KEY }}
          shard: ${{ matrix.shard }}
          mods: ${{ inputs.mods }}
      - uses: actions/download-artifact@v8
        if: inputs.artifact != ''
        with:
          name: ${{ inputs.artifact }}
          path: ${{ inputs.artifact-path }}
      - name: Prepare
        if: inputs.prepare != ''
        env:
          PREPARE: ${{ inputs.prepare }}
        run: eval "$PREPARE"
      - name: Job name
        run: echo "JOB_NAME=${JOB_NAME%%/*}" >> "$GITHUB_ENV"
      - uses: chambem42/KspTest/.github/actions/run@main
        with:
          project: ${{ inputs.test-project }}
          name: ${{ env.JOB_NAME }}
          filter: ${{ inputs.filter }}
          args: ${{ inputs.test-args }}
          coverage: ${{ inputs.coverage }}

  linux:
    needs: game
    if: needs.game.outputs.ready == 'true' && contains(fromJSON(inputs.legs), 'linux')
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.game.outputs.shards) }}
    name: in-game (linux${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    environment: *secrets
    defaults:
      run:
        shell: bash
    env:
      JOB_NAME: linux${{ matrix.shard && format('-{0}', matrix.shard) || '' }}
    steps: *test-steps

  report-windows:
    needs: windows
    if: always() && needs.windows.result != 'skipped'
    name: report (windows)
    runs-on: ubuntu-24.04
    permissions: &report-permissions
      contents: read
      statuses: write
    steps:
      - uses: chambem42/KspTest/.github/actions/report@main
        with:
          leg: windows
          title: ${{ inputs.title }}
          status: ${{ inputs.title }} (Windows)

  report-linux:
    needs: linux
    if: always() && needs.linux.result != 'skipped'
    name: report (linux)
    runs-on: ubuntu-24.04
    permissions: *report-permissions
    steps:
      - uses: chambem42/KspTest/.github/actions/report@main
        with:
          leg: linux
          title: ${{ inputs.title }}
          status: ${{ inputs.title }} (Linux)
