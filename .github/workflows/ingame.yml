name: In-game tests

# A repository's KspTest in-game tests on GitHub's runners, as one job in its own workflow:
#
#   on:
#     push:
#     pull_request_target:
#       types: [opened, synchronize, reopened, labeled]
#     workflow_dispatch:
#   jobs:
#     ingame:
#       uses: chambem42/KspTest/.github/workflows/ingame.yml@main
#       permissions: { contents: read, pull-requests: write, statuses: write, id-token: write }
#       with:
#         test-project: KspTests/MyMod.KspTests.Run
#
# KSP comes from encrypted 7z volumes in a private repository's release (ci/Pack-KspGame.ps1). A repository in one of
# the accounts KspTest's game broker allows (ci/broker) gets it from the broker, for the job's OIDC token (id-token:
# write): no secrets. Any other brings a game of its own: its variable KSP_GAME_REPO (owner/name) and its secrets
# KSP_GAME_TOKEN (fine-grained, Contents: read-only on that repository alone) and KSP_GAME_KEY (the archive key), passed
# (secrets: KSP_GAME_TOKEN: ..., or inherit within one account), from the repository or its environment ksp-game. With
# neither (broker empty, no variable) the in-game jobs are skipped with a notice, not failed.
#
# A fork's pull request (pull_request_target: the workflow is the default branch's, the code the PR's head) runs only
# when the gate action lets it: opened by someone with write access, or reviewed (its latest commit) and labelled
# run-ingame by such a one. Let in, its code runs on runners with the game and its key, as it would after a merge.
#
# The jobs: a gate, a check for the game (and the legs' earlier test durations, which a leg's shards deal the tests
# by), the tests (a job per leg, each split between `shards` jobs side by side, KSPTEST_SHARD), per leg its results
# (summary, screenshots page and one commit status) and its durations saved, and CKAN's new downloads added to the
# download cache. The steps are KspTest's actions (.github/actions), which a repository can also use in a workflow of
# its own. Not from a fork's pull request, nor with save-caches false: the caches (what later runs install and deal
# their tests by) stay the repository's.

on:
  workflow_call:
    inputs:
      test-project:
        description: The KspTest .Run test project, from the repository root
        type: string
        required: true
      title:
        description: The results' title (summary, page) and their commit status's name, with the leg
        type: string
        default: In-game tests
      legs:
        description: The platforms, a JSON array of windows and linux
        type: string
        default: '["windows"]'
      shards:
        description: Jobs each leg's tests are split between
        type: number
        default: 1
      filter:
        description: dotnet test --filter (default all but the Explicit tests)
        type: string
        default: ""
      test-args:
        description: More dotnet test arguments, space separated
        type: string
        default: ""
      mods:
        description: CKAN identifiers installed into the game itself (what the test project builds against), space separated
        type: string
        default: ""
      prepare:
        description: >-
          A bash command run in the repository before the tests, with the game set up (KSPTEST_GAME, KSPTEST_ROOT): to
          stage references, say
        type: string
        default: ""
      artifact:
        description: An artifact of the calling run downloaded before the tests (a build job's output, say)
        type: string
        default: ""
      artifact-path:
        description: Where the artifact goes, from the repository root
        type: string
        default: ""
      coverage:
        description: >-
          The mod's assemblies to measure line coverage of (AltCover, on Windows), as the test project's build leaves
          them (one folder under a GameData), from the repository root, space separated: the report goes in the Windows
          leg's summary
        type: string
        default: ""
      timeout-minutes:
        description: Each test job's timeout
        type: number
        default: 90
      broker:
        description: KspTest's game broker (ci/broker), for a repository with no game of its own; empty for none
        type: string
        default: ""
      before:
        description: >-
          A bash command run in the first Windows job before its in-game tests, after the build is instrumented (unit
          tests against the game's assemblies, say; see the run action's before): counts it writes to COV as unit*.xml
          join the coverage report. Its failure fails that job
        type: string
        default: ""
      statuses:
        description: Each leg's result as a commit status (on a fork's pull request, its head commit; else the run's commit)
        type: boolean
        default: true
      save-caches:
        description: >-
          Whether the run saves the legs' test durations and CKAN's new downloads for later runs (false: a build of
          code not yet merged, say). Never from a fork's pull request
        type: boolean
        default: true

    secrets:
      KSP_GAME_TOKEN:
        description: "A game of the caller's own: a token that may read its repository's releases"
        required: false
      KSP_GAME_KEY:
        description: "A game of the caller's own: the archive's key"
        required: false

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - id: gate
        uses: chambem42/KspTest/.github/actions/gate@main

  # whether the repository has the game set up (the environment ksp-game and its KSP_GAME_REPO), and each leg's jobs
  game:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: ksp-game
      deployment: false
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      shards: ${{ steps.check.outputs.shards }}
    steps:
      - id: check
        env:
          GAME_REPO: ${{ vars.KSP_GAME_REPO }}
          BROKER: ${{ inputs.broker }}
          SHARDS: ${{ inputs.shards }}
        run: |
          if [ -n "$GAME_REPO" ] || [ -n "$BROKER" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::no game: neither KspTest's game broker nor a game of the repository's own (KSP_GAME_REPO): the in-game tests are skipped"; fi
          # each leg's jobs: its share of the tests, k/N ("" for all of them in one job)
          jq -nc --argjson n "$SHARDS" 'if $n > 1 then [range(1; $n + 1) | "\(.)/\($n)"] else [""] end' |
            sed 's/^/shards=/' >> "$GITHUB_OUTPUT"
      - name: Legs
        id: legs
        env:
          LEGS: ${{ inputs.legs }}
        run: echo "list=$(jq -r 'join(" ")' <<< "$LEGS")" >> "$GITHUB_OUTPUT"
      # each leg's earlier durations, once for all its shards (split runs only)
      - if: steps.check.outputs.ready == 'true' && inputs.shards > 1
        uses: chambem42/KspTest/.github/actions/durations@main
        with:
          mode: restore
          legs: ${{ steps.legs.outputs.list }}

  # One job per leg (the legs' shards, side by side as a matrix), so each leg's report waits for its own jobs only, not
  # the other leg's. The two run the same steps (the anchor).
  windows:
    needs: game
    if: needs.game.outputs.ready == 'true' && contains(fromJSON(inputs.legs), 'windows')
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.game.outputs.shards) }}
    name: in-game (windows${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    runs-on: windows-2022
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # id-token: the job's OIDC token, for the game broker
    permissions: &test-permissions
      contents: read
      id-token: write
    # the secrets (the caller's environment); not a deployment: the environment only holds them
    environment: &secrets
      name: ksp-game
      deployment: false
    defaults:
      run:
        shell: bash
    env:
      # this job's name in its artifacts: the leg, and its shard if split (1/3 -> windows-1)
      JOB_NAME: windows${{ matrix.shard && format('-{0}', matrix.shard) || '' }}
    steps: &test-steps
      - uses: actions/checkout@v6
        with:
          # a fork's pull request (pull_request_target): its head as the event saw it, which the gate let in
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' }}
          submodules: recursive
          persist-credentials: false
      - uses: chambem42/KspTest/.github/actions/setup@main
        with:
          game-repo: ${{ vars.KSP_GAME_REPO }}
          game-token: ${{ secrets.KSP_GAME_TOKEN }}
          game-key: ${{ secrets.KSP_GAME_KEY }}
          broker: ${{ inputs.broker }}
          shard: ${{ matrix.shard }}
          mods: ${{ inputs.mods }}
      - uses: actions/download-artifact@v8
        if: inputs.artifact != ''
        with:
          name: ${{ inputs.artifact }}
          path: ${{ inputs.artifact-path }}
      - name: Prepare
        if: inputs.prepare != ''
        env:
          PREPARE: ${{ inputs.prepare }}
        run: eval "$PREPARE"
      - name: Job name
        run: echo "JOB_NAME=${JOB_NAME%%/*}" >> "$GITHUB_ENV"
      - uses: chambem42/KspTest/.github/actions/run@main
        with:
          project: ${{ inputs.test-project }}
          name: ${{ env.JOB_NAME }}
          filter: ${{ inputs.filter }}
          args: ${{ inputs.test-args }}
          coverage: ${{ inputs.coverage }}
          # the first Windows job's
          before: ${{ runner.os == 'Windows' && (matrix.shard == '' || startsWith(matrix.shard, '1/')) && inputs.before || '' }}

  linux:
    needs: game
    if: needs.game.outputs.ready == 'true' && contains(fromJSON(inputs.legs), 'linux')
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.game.outputs.shards) }}
    name: in-game (linux${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions: *test-permissions
    environment: *secrets
    defaults:
      run:
        shell: bash
    env:
      JOB_NAME: linux${{ matrix.shard && format('-{0}', matrix.shard) || '' }}
    steps: *test-steps

  report-windows:
    needs: windows
    if: always() && needs.windows.result != 'skipped'
    name: report (windows)
    runs-on: ubuntu-24.04
    permissions: &report-permissions
      contents: read
      statuses: write
    steps:
      - uses: chambem42/KspTest/.github/actions/report@main
        with:
          leg: windows
          title: ${{ inputs.title }}
          status: ${{ inputs.statuses && format('{0} (Windows)', inputs.title) || '' }}

  report-linux:
    needs: linux
    if: always() && needs.linux.result != 'skipped'
    name: report (linux)
    runs-on: ubuntu-24.04
    permissions: *report-permissions
    steps:
      - uses: chambem42/KspTest/.github/actions/report@main
        with:
          leg: linux
          title: ${{ inputs.title }}
          status: ${{ inputs.statuses && format('{0} (Linux)', inputs.title) || '' }}

  # this run's test durations of a leg added to those its shards dealt the tests by, for its next run
  durations-windows:
    needs: windows
    if: >-
      always() && needs.windows.result != 'skipped' && inputs.shards > 1 && inputs.save-caches &&
      github.event_name != 'pull_request_target'
    name: durations (windows)
    runs-on: ubuntu-24.04
    steps:
      - uses: chambem42/KspTest/.github/actions/durations@main
        with:
          mode: save
          leg: windows

  durations-linux:
    needs: linux
    if: >-
      always() && needs.linux.result != 'skipped' && inputs.shards > 1 && inputs.save-caches &&
      github.event_name != 'pull_request_target'
    name: durations (linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: chambem42/KspTest/.github/actions/durations@main
        with:
          mode: save
          leg: linux

  # the test jobs' new CKAN downloads added to the cache entry they started from (none new: nothing saved)
  ckan-cache:
    needs: [windows, linux]
    if: >-
      always() && (needs.windows.result != 'skipped' || needs.linux.result != 'skipped') && inputs.save-caches &&
      github.event_name != 'pull_request_target'
    name: CKAN download cache
    runs-on: ubuntu-24.04
    steps:
      - uses: chambem42/KspTest/.github/actions/ckan-cache@main
