name: KspTest run
description: >-
  A test project's in-game tests (dotnet test, after the setup action), built against the game and KspTest as setup
  left them (KspDir, KspTestRoot). Its results, logs and TRX are uploaded as ingame-results-NAME, with a crashed KSP's
  Player.log and crash folder: never the game or an instance. With coverage (Windows), the mod's assemblies are
  instrumented once built (ci/coverage/coverage.sh) and each session's counts uploaded as coverage-NAME; a failure to
  instrument leaves the tests on the plain build, with a warning. Fails when a test does.

inputs:
  project:
    description: The test project to run (a KspTest .Run project), from the repository root
    required: true
  name:
    description: "This job's name in its artifacts (ingame-results-NAME): the leg, and its shard if split"
    required: true
  filter:
    description: dotnet test --filter (default all but the Explicit tests)
    default: ""
  args:
    description: More dotnet test arguments (-p:Name=Value and the like), space separated
    default: ""
  coverage:
    description: >-
      The mod's assemblies to measure line coverage of, as its build leaves them (one folder under a GameData), from the
      repository root, space separated; Windows only (AltCover)
    default: ""

runs:
  using: composite
  steps:
    - name: Build
      if: inputs.coverage != '' && runner.os == 'Windows'
      shell: bash
      env:
        PROJECT: ${{ inputs.project }}
        ARGS: ${{ inputs.args }}
      run: |
        # shellcheck disable=SC2086
        dotnet build "$PROJECT" -p:KspDir="$KSPTEST_GAME" -p:KspTestRoot="$KSPTEST_ROOT" $ARGS -nologo -v q
        echo "KSPTEST_BUILT=1" >> "$GITHUB_ENV"
    - name: Instrument
      id: instrument
      if: inputs.coverage != '' && runner.os == 'Windows'
      continue-on-error: true
      shell: bash
      env:
        COVERAGE: ${{ inputs.coverage }}
      run: |
        # shellcheck disable=SC2086
        bash "$GITHUB_ACTION_PATH/../../../ci/coverage/coverage.sh" instrument $COVERAGE ||
          { echo "::warning::not instrumented: the in-game tests run on the plain build"; exit 1; }
    - name: In-game tests
      shell: bash
      env:
        PROJECT: ${{ inputs.project }}
        NAME: ${{ inputs.name }}
        FILTER: ${{ inputs.filter }}
        ARGS: ${{ inputs.args }}
      run: |
        set -o pipefail
        # shellcheck disable=SC2206
        args=(test "$PROJECT" -p:KspDir="$KSPTEST_GAME" -p:KspTestRoot="$KSPTEST_ROOT" $ARGS
              --logger "console;verbosity=normal" --logger "trx;LogFileName=ingame-$NAME.trx" --results-directory "$KSPTEST_WORK/trx")
        # built (and instrumented) above: as it is
        [ -n "$KSPTEST_BUILT" ] && args+=(--no-build)
        [ -n "$FILTER" ] && args+=(--filter "$FILTER")
        # without xUnit's "[xUnit.net 0:00:12.34] Assembly: " before each line: KspTest's lines carry their own stamp
        dotnet "${args[@]}" 2>&1 | sed -u -E 's/^\[xUnit\.net [0-9:.]+\] ([^ :]+: )?//'
    - name: Coverage counts
      if: always() && steps.instrument.outcome == 'success'
      shell: bash
      env:
        NAME: ${{ inputs.name }}
      run: bash "$GITHUB_ACTION_PATH/../../../ci/coverage/coverage.sh" collect "$NAME"
    # the counts only
    - uses: actions/upload-artifact@v6
      if: always() && steps.instrument.outcome == 'success'
      with:
        name: coverage-${{ inputs.name }}
        path: ${{ runner.temp }}/cov/ingame-*.xml
        if-no-files-found: warn
    # a crashed KSP leaves its native stack in Unity's Player.log and the crash folder, outside the results
    - name: Crash reports
      if: failure()
      shell: bash
      env:
        NAME: ${{ inputs.name }}
      run: |
        d="$KSPTEST_WORK/crash/$NAME"; mkdir -p "$d"
        if [ "$RUNNER_OS" = Windows ]; then
          p="$(cygpath -u "$USERPROFILE")/AppData/LocalLow/Squad/Kerbal Space Program"
          c="$(cygpath -u "$LOCALAPPDATA")/Temp/Squad/Kerbal Space Program/Crashes"
        else
          p="$HOME/.config/unity3d/Squad/Kerbal Space Program"; c=""
        fi
        cp "$p"/Player*.log "$d/" 2>/dev/null || echo "no Player.log in $p"
        if [ -n "$c" ] && [ -d "$c" ]; then cp -r "$c" "$d/"; fi
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: ingame-results-${{ inputs.name }}
        # the sessions' coverage counts go in the coverage artifact
        path: |
          ${{ runner.temp }}/results
          ${{ runner.temp }}/trx
          ${{ runner.temp }}/crash
          !${{ runner.temp }}/results/*/collected
        if-no-files-found: warn
